name: Rust experimental release
on:
  push:
    tags: ['rust-v*']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/rust-windows-build.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: airplay-windows-rust-x64-${{ github.sha }}
          path: dist-rust
      - name: Package experimental build
        shell: bash
        run: |
          if [ '${{ github.event_name }}' = workflow_dispatch ]; then
            tag="rust-dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "RUST_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          cd dist-rust
          zip -r "../airplay-windows-$tag-x64.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RUST_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Rust experimental ${{ env.RUST_RELEASE_TAG }}
          files: airplay-windows-${{ env.RUST_RELEASE_TAG }}-x64.zip
          prerelease: true
          generate_release_notes: true
          body: 'Iced/wgpu + cpal experimental build. Automated protocol/media checks are required before packaging. Windows/iPhone feature and performance acceptance remains subject to docs/RUST_ACCEPTANCE.md; this build does not replace the C++ stable release.'
