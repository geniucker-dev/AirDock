name: Rust CI
on:
  push:
    branches: [feat/rust-slint]
  pull_request:
    paths: ['Cargo.*', 'rust/**', 'ui/**', 'build.rs', 'rust-toolchain.toml', 'tools/rust*', '.github/workflows/rust*', '.github/workflows/release.yml', 'docs/RUST*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  # Let a cold native dependency build finish and save its cache. GitHub keeps
  # at most one queued run, replacing it with the newest commit when necessary.
  cancel-in-progress: false
jobs:
  windows:
    uses: ./.github/workflows/rust-windows-build.yml
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Install native development dependencies
        run: sudo apt-get update && sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libsdl2-dev libfontconfig1-dev clang libclang-dev pkg-config ffmpeg xvfb xauth xdotool
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --bins --examples
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography Pillow
      - run: python tools/rust_integration.py --binary target/debug/airplay-windows
      - run: python tools/rust_reconnect_integration.py --binary target/debug/airplay-windows
      - run: python tools/rust_hls_integration.py --binary target/debug/airplay-windows
      - name: FairPlay differential oracle
        run: |
          cc -O2 -Ithird_party/playfair rust/tests/playfair_reference.c third_party/playfair/playfair.c third_party/playfair/omg_hax.c third_party/playfair/hand_garble.c third_party/playfair/sap_hash.c third_party/playfair/modified_md5.c -lm -o target/playfair-reference
          python tools/rust_fairplay_differential.py --reference target/playfair-reference --rust target/debug/examples/fairplay_vectors
      - name: Slint UI smoke capture
        run: xvfb-run -a python tools/rust_ui_smoke.py --binary target/debug/airplay-windows
      - name: Encrypted video through Slint presentation
        run: xvfb-run -a python tools/rust_integration.py --gui --binary target/debug/airplay-windows
      - name: Reconnected video through Slint presentation
        run: xvfb-run -a python tools/rust_reconnect_integration.py --gui --binary target/debug/airplay-windows
      - name: Release conversion performance against C++ reference
        run: |
          cargo build --locked --release --example core_bench
          c++ -O3 rust/tests/conversion_reference.cpp -lavutil -lswscale -o target/conversion-reference
          python tools/rust_performance.py --reference target/conversion-reference --rust target/release/examples/core_bench --output rust-validation/conversion-performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-linux-validation-${{ github.sha }}
          path: rust-validation/
          if-no-files-found: error
