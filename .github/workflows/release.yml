name: Release

# Builds the Windows binary on a GitHub-hosted Windows runner and publishes
# either a versioned release or a development prerelease.
#
# Triggers:
#   - Push of a tag matching v* (e.g. v0.1.0): publishes a normal release.
#   - Manual workflow_dispatch from the Actions tab: publishes a prerelease
#     tagged dev-<run number>-<short SHA>.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed for softprops/action-gh-release

jobs:
  implementation:
    name: Select release implementation
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.source.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect checked-out application sources
        id: source
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            for required in rust/src/main.rs ui/app.slint rust/vcpkg.json; do
              if [[ ! -f "$required" ]]; then
                echo "::error::Rust release source is incomplete: $required"
                exit 1
              fi
            done
            echo 'kind=rust' >> "$GITHUB_OUTPUT"
            echo 'Release implementation: Rust + Slint'
          else
            echo 'kind=cpp' >> "$GITHUB_OUTPUT"
            echo 'Release implementation: C++'
          fi
  rust:
    name: Rust experimental release
    needs: implementation
    if: needs.implementation.outputs.kind == 'rust'
    uses: ./.github/workflows/rust-release.yml
  build-windows:
    name: C++ Windows release
    needs: implementation
    if: needs.implementation.outputs.kind == 'cpp'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pre-installed vcpkg on windows-latest sits at a recent
      # commit whose working tree carries port versions that aren't
      # listed in our manifest's `builtin-baseline` versions/baseline.json.
      # Clone a fresh vcpkg pinned at our baseline so port versions
      # and baseline stay in sync.
      - name: Read vcpkg baseline from manifest
        id: vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          "baseline=$baseline" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "vcpkg baseline = $baseline"

      - name: Set up pinned vcpkg
        # run-vcpkg configures vcpkg's package-granular GitHub Actions binary
        # cache. A second cache of build/vcpkg_installed would duplicate those
        # artifacts and spend extra time archiving/restoring a large tree.
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg.outputs.baseline }}

      - name: Configure (CMake + vcpkg manifest mode)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -G "Visual Studio 18 2026" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Package zip
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0,7)
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "dev-${{ github.run_number }}-$shortSha"
            $releaseName = "Development build $shortSha"
            $prerelease = "true"
          } else {
            $tag = "${{ github.ref_name }}"
            $releaseName = $tag
            $prerelease = "false"
          }
          $zipName = "airplay-windows-$tag-x64.zip"
          Compress-Archive -Path build\Release\* -DestinationPath $zipName -Force
          "ZIP_PATH=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "IS_PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem $zipName | Format-List Name, Length

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          name: ${{ env.RELEASE_NAME }}
